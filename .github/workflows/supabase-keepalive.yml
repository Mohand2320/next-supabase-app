name: Supabase Keepalive

on:
  schedule:
    # Exécution 3x/semaine (lundi, mercredi, vendredi à 08:00 UTC)
    # Marge de sécurité plus large que 2x/semaine face à la pause auto (~7 jours d'inactivité)
    - cron: '0 8 * * 1,3,5'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # évite qu'un run bloqué tourne des heures

    steps:
      - name: Vérifier le secret SUPABASE_DB_URL
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$DB_URL" ]; then
            echo "❌ Erreur: Le secret SUPABASE_DB_URL est introuvable ou vide."
            exit 1
          fi
          echo "✅ Secret trouvé."

      - name: Installer le client PostgreSQL (si absent)
        run: |
          if ! command -v psql &> /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          else
            echo "✅ psql déjà présent, installation ignorée."
          fi

      - name: Health Check avec retry (SELECT 1)
        id: healthcheck
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: 10
        run: |
          set -uo pipefail

          MAX_RETRIES=3
          RETRY_DELAY=15  # secondes entre chaque tentative
          ATTEMPT=1
          SUCCESS=false

          while [ $ATTEMPT -le $MAX_RETRIES ]; do
            echo "🔄 Tentative $ATTEMPT/$MAX_RETRIES de connexion à Supabase..."

            if psql "$DB_URL" -c "SELECT 1 AS keepalive_ok;" -v ON_ERROR_STOP=1; then
              echo "✅ Connexion réussie et requête exécutée. Le projet est actif !"
              SUCCESS=true
              break
            else
              echo "⚠️ Échec de la tentative $ATTEMPT."
              if [ $ATTEMPT -lt $MAX_RETRIES ]; then
                echo "⏳ Nouvelle tentative dans ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi

            ATTEMPT=$((ATTEMPT + 1))
          done

          if [ "$SUCCESS" = false ]; then
            echo "❌ Échec de connexion après $MAX_RETRIES tentatives."
            echo "Le projet Supabase est peut-être en veille, supprimé, ou les identifiants sont invalides."
            exit 1
          fi

      - name: Notification en cas d'échec
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "[GitHub Actions] ⚠️ Échec du Keepalive Supabase"
          body: |
            Le workflow de maintien d'activité (Keepalive) a échoué après plusieurs tentatives.

            Causes possibles :
            - Le projet Supabase est en veille (plan gratuit, >7 jours d'inactivité) → va sur le dashboard et clique "Restore project"
            - Le secret SUPABASE_DB_URL est invalide, expiré, ou pointe vers un projet supprimé
            - Le mot de passe de la base a été reset sans mettre à jour le secret GitHub

            Vérifie le run complet ici : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.MAIL_USER }}
          from: "Supabase Keepalive <${{ secrets.MAIL_USER }}>"
